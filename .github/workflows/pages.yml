# Baut den statischen Rundgang und veröffentlicht ihn auf GitHub Pages.
#
# Wichtig: Pages führt kein Node aus. Was hier landet, ist ein Rundgang durch
# echte, mit Demodaten gefüllte Seiten — nicht die laufende Anwendung. Für die
# braucht es einen Node-Host (siehe Dockerfile).
name: Rundgang veröffentlichen

# Der Standard-Branch dieses Repositories ist claude/erstellung-k1jxn8, nicht
# main. Die Umgebung github-pages nimmt Deployments nur vom Standard-Branch an —
# ein Lauf auf main scheitert deshalb, bevor auch nur ein Schritt beginnt.
on:
  push:
    branches: [claude/erstellung-k1jxn8, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: npm test
      - name: Rundgang bauen
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
